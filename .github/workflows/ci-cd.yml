name: Perinty RAG v2 CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI (Python & RAG Validation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Backend Syntax & Imports
        run: |
          python -m py_compile app/main.py app/rag.py app/parsers.py app/config.py
      - name: Regression tests and ASGI imports
        working-directory: .
        run: |
          python -m unittest discover -s backend/tests -v
          python -m unittest backend.test_rag -v

  frontend-ci:
    name: Frontend CI (React & Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: |
          npm test
          npm run build
